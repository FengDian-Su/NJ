<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Test</title>
  <style>
    .word-entry {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .word-entry h3 {
      margin: 0;
      font-size: 1.2em;
    }
    .word-entry p {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1>Word List</h1>
  <div id="wordList"></div>

  <script>
    const fileId = "1Ur6REh1i7A6wqDDnahDm_MnisaOj65xY";
    const fileUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;

    fetch(fileUrl)
      .then(response => response.json())
      .then(data => {
        const wordList = data;
        const wordListContainer = document.getElementById('wordList');
        wordList.forEach(wordEntry => {
          const wordEntryDiv = document.createElement('div');
          wordEntryDiv.classList.add('word-entry');

          wordEntryDiv.innerHTML = `
            <h3>${wordEntry.word}</h3>
            <p><strong>Meaning:</strong> ${wordEntry.meaning}</p>
            <p><strong>Part of Speech:</strong> ${wordEntry.part_of_speech}</p>
            <p><strong>Example Sentence:</strong> ${wordEntry.sentence}</p>
          `;

          wordListContainer.appendChild(wordEntryDiv);
        });
      })
      .catch(error => {
        console.error("Error loading the JSON file:", error);
      });
  </script>
</body>
</html>
